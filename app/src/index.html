<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YaClue 后端体验台</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">MATH WORKSPACE</p>
        <h1>YaClue</h1>
        <p>选择要解决的问题，输入数学内容，然后查看结果或步骤。</p>
      </div>
      <span id="engine-state" class="state">引擎就绪</span>
    </header>

    <main>
      <section class="card calculator">
        <nav id="domain-nav" class="domain-nav" aria-label="数学领域"></nav>
        <div class="toolbar">
          <label class="wide">任务
            <select id="mode"></select>
          </label>
          <label id="output-mode-field">输出
            <select id="output-mode">
              <option value="steps">显示步骤</option>
              <option value="result">只看结果</option>
            </select>
          </label>
          <label>变量 / 自变量<input id="variable" value="x" /></label>
          <label data-for="steps">步骤粒度
            <select id="verbosity">
              <option value="standard">标准</option>
              <option value="concise">简洁</option>
              <option value="detailed">详细</option>
            </select>
          </label>
          <label data-for="derivative">阶数<input id="order" type="number" min="1" value="1" /></label>
          <label data-for="transform">变换
            <select id="operation">
              <option value="simplify">Simplify</option>
              <option value="tidy">Tidy</option>
              <option value="expand">Expand</option>
              <option value="factor">Factor</option>
              <option value="apart">Apart</option>
            </select>
          </label>
          <label data-for="definite">下限<input id="from" value="0" /></label>
          <label data-for="definite">上限<input id="to" value="Pi" /></label>
          <label data-for="limit limit_steps">趋近值<input id="at" value="0" /></label>
          <label data-for="limit limit_steps">方向
            <select id="direction">
              <option value="both">双侧</option>
              <option value="left">左侧</option>
              <option value="right">右侧</option>
            </select>
          </label>
          <label data-for="ode ode_steps ode_numeric">因变量<input id="dependent" value="y" /></label>
          <label data-for="ode ode_steps ode_numeric" class="wide">初值条件
            <input id="ode-conditions" placeholder="阶数,点,值；如 0,0,1" />
          </label>
          <label data-for="ode_numeric">积分终点<input id="ode-end" type="number" step="any" value="1" /></label>
          <label data-for="ode_numeric">初始步长<input id="ode-step" type="number" step="any" value="0.01" /></label>
          <label data-for="ode_numeric">绝对容差<input id="ode-absolute-tolerance" type="number" step="any" value="1e-9" /></label>
          <label data-for="ode_numeric">相对容差<input id="ode-relative-tolerance" type="number" step="any" value="1e-7" /></label>
          <label data-for="approximate">精度位数<input id="precision" type="number" min="1" max="1000" value="30" /></label>
          <label data-for="root">初值<input id="root-initial" type="number" step="any" value="1" /></label>
          <label data-for="root">误差<input id="root-accuracy" type="number" step="any" value="0.00000001" /></label>
          <label data-for="root">区间下界<input id="root-min" type="number" step="any" placeholder="可留空" /></label>
          <label data-for="root">区间上界<input id="root-max" type="number" step="any" placeholder="可留空" /></label>
          <label data-for="taylor">展开点<input id="taylor-point" value="0" /></label>
          <label data-for="taylor">次数<input id="taylor-degree" type="number" min="0" max="64" value="6" /></label>
          <label data-for="matrix">矩阵运算
            <select id="matrix-operation">
              <option value="auto">从表达式识别</option>
              <option value="add">相加</option>
              <option value="multiply">相乘</option>
              <option value="transpose">转置</option>
              <option value="determinant">行列式</option>
              <option value="inverse">逆矩阵</option>
              <option value="solve">解线性方程组</option>
              <option value="eigenvalues">特征值</option>
            </select>
          </label>
          <label id="matrix-right-field" data-for="matrix" class="wide">右操作数<input id="matrix-right" value="{{5,6},{7,8}}" /></label>
          <label data-for="plot">横轴最小值<input id="plot-min" type="number" value="-6.28" step="any" /></label>
          <label data-for="plot">横轴最大值<input id="plot-max" type="number" value="6.28" step="any" /></label>
        </div>

        <label class="expression-label"><span id="expression-title">表达式</span>
          <textarea id="expr" rows="3" spellcheck="false">Sin(x)^2</textarea>
        </label>
        <p id="input-help" class="help"></p>
        <div class="examples" aria-label="输入示例">
          <span>试一试</span>
          <div id="example-list"></div>
        </div>
        <details class="syntax-help">
          <summary>输入格式帮助</summary>
          <div id="syntax-content"></div>
        </details>
        <div class="actions">
          <button id="go">计算</button>
          <span id="timing"></span>
        </div>
      </section>

      <aside class="card assumptions">
        <div class="section-title">
          <div><p class="eyebrow">SESSION</p><h2>当前假设</h2></div>
          <button id="clear-assumptions" class="quiet">全部清除</button>
        </div>
        <div class="assumption-form">
          <input id="assumption-symbol" value="n" aria-label="假设符号" />
          <select id="assumption-fact" aria-label="假设性质">
            <option value="real">实数</option>
            <option value="integer">整数</option>
            <option value="positive">正数</option>
            <option value="negative">负数</option>
            <option value="non_zero">非零</option>
          </select>
          <button id="add-assumption">添加</button>
        </div>
        <div id="assumption-list" class="chips"><span class="empty">暂无假设</span></div>
      </aside>

      <section class="card output">
        <div class="section-title"><div><p class="eyebrow">RESULT</p><h2>计算结果</h2></div></div>
        <p id="error" class="error" hidden></p>
        <div id="summary" hidden></div>
        <div id="steps-list"></div>
        <canvas id="plot" hidden></canvas>
        <details id="raw-box" hidden><summary>结构化结果</summary><pre id="raw"></pre></details>
        <div id="empty-result" class="empty-result">选择功能并开始计算。</div>
      </section>
    </main>

    <script src="vendor/katex/katex.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
