<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2e9cf" />
    <title>YaClue</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <nav class="topbar" aria-label="主导航"><button id="calculate-tab" class="active" type="button" aria-current="page">计算</button><button id="menu-tab" type="button">菜单</button></nav>
      <section id="calculator-view" class="view calculator-view">
        <section class="workspace" aria-label="计算区域">
          <div class="math-row input-row"><math-field id="math-input" aria-label="数学表达式"></math-field></div>
          <section id="steps" class="steps" aria-label="计算步骤"></section>
          <output id="answer" class="math-row answer-row" aria-live="polite"></output>
        </section>
        <div class="keyboard-dock" aria-label="数学键盘控制"><button id="keyboard-toggle" class="keyboard-toggle" type="button" aria-label="收起数学键盘" aria-expanded="true"></button></div>
      </section>
      <section id="menu-view" class="view menu-view" hidden><button class="menu-item" type="button" data-view="help">帮助</button><button class="menu-item" type="button" data-view="settings">设置</button></section>
      <section id="help-view" class="view content-view" hidden><button class="back" type="button" data-view="menu">‹ 返回菜单</button><p>我是帮助</p></section>
      <section id="settings-view" class="view content-view" hidden><button class="back" type="button" data-view="menu">‹ 返回菜单</button><p>我是设置</p></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
