name: Prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"

permissions:
  contents: write

jobs:
  validate:
    name: Full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run release gate
        run: ./scripts/test-gate.sh release

  build:
    name: ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build packages
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build and publish prerelease
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: "YaClue ${{ github.ref_name }}"
          releaseBody: |
            Alpha 3 freezes the pre-semantic-core implementation as the correctness and performance baseline for the upcoming architectural rewrite.

            Desktop packages are available for Linux, macOS, and Windows. The Android arm64 APK is test-signed for direct evaluation and is not an app-store package. See docs/releases/v0.1.0-alpha.3.md for the frozen baseline and known distribution constraints.
          releaseDraft: false
          prerelease: true

  android:
    name: Android arm64 Release APK
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Create ephemeral alpha signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/yaclue-alpha.jks" -storepass yaclue-alpha -alias yaclue-alpha -keypass yaclue-alpha -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YaClue Alpha,OU=Testing,O=YaClue,L=Unknown,ST=Unknown,C=US"
          echo "YACLUE_ANDROID_KEYSTORE=$RUNNER_TEMP/yaclue-alpha.jks" >> "$GITHUB_ENV"
          echo "YACLUE_ANDROID_STORE_PASSWORD=yaclue-alpha" >> "$GITHUB_ENV"
          echo "YACLUE_ANDROID_KEY_ALIAS=yaclue-alpha" >> "$GITHUB_ENV"
          echo "YACLUE_ANDROID_KEY_PASSWORD=yaclue-alpha" >> "$GITHUB_ENV"
      - name: Build Android Release APK
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npm run tauri -- android build --target aarch64 --apk --ci
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaClue-Android-arm64-release-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
      - name: Attach APK to prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
